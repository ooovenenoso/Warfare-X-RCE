name: Notify Discord on Merge

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  send-discord-webhook:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      DISCORD_MERGE_WEBHOOK_URL: ${{ secrets.DISCORD_MERGE_WEBHOOK_URL }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      REPOSITORY: ${{ github.repository }}
      MERGE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - name: Send merge notification
        run: |
          if [ -z "$DISCORD_MERGE_WEBHOOK_URL" ]; then
            echo "DISCORD_MERGE_WEBHOOK_URL is not configured; skipping notification."
            exit 0
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          commit = os.environ.get("MERGE_COMMIT", "")
          payload = {
              "username": "GitHub Merge Bot",
              "embeds": [{
                  "title": f"PR #{os.environ['PR_NUMBER']} merged in {os.environ['REPOSITORY']}",
                  "url": os.environ["PR_URL"],
                  "color": 5814783,
                  "fields": [
                      {"name": "Pull Request", "value": f"[#{os.environ['PR_NUMBER']} {os.environ['PR_TITLE']}]({os.environ['PR_URL']})", "inline": False},
                      {"name": "Author", "value": os.environ["PR_AUTHOR"], "inline": True},
                      {"name": "Merge Commit", "value": commit[:7], "inline": True},
                  ],
              }],
          }
          req = urllib.request.Request(os.environ["DISCORD_MERGE_WEBHOOK_URL"], data=json.dumps(payload).encode(), headers={"Content-Type": "application/json"}, method="POST")
          with urllib.request.urlopen(req, timeout=10) as response:
              print(f"Discord responded with HTTP {response.status}")
          PY
